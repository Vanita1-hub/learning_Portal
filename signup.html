<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Student Portal</title>
</head>
<body>
    <h1>Sign Up</h1>
    <br>
    <p>Join our learning community today!</p>
    
    <form id="signupForm" onsubmit="handleSubmit(event)">
        <div>
            <label for="fullname">Full Name <span style="color: red;">*</span></label>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
        </div>
        
        <div>
            <label for="email">Email <span style="color: red;">*</span></label>
            <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        </div>
        
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
        </div>
        
        <div>
            <label for="dob">Date of Birth <span style="color: red;">*</span></label>
            <input type="date" id="dob" name="dob" required>
        </div>
        
        <div>
            <label for="education">Education Level <span style="color: red;">*</span></label>
            <select id="education" name="education" required>
                <option value="">Select Level</option>
                <option value="high-school">High School</option>
                <option value="undergraduate">Undergraduate</option>
                <option value="postgraduate">Postgraduate</option>
                <option value="professional">Professional</option>
            </select>
        </div>
        
        <div>
            <label for="institution">Institution/School <span style="color: red;">*</span></label>
            <input type="text" id="institution" name="institution" required placeholder="Enter your school or institution name">
        </div>
        
        <div>
            <label>Interests in Courses</label>
            <input type="checkbox" id="web" name="interests" value="web">
            <label for="web">Web Development</label>
            
            <input type="checkbox" id="python" name="interests" value="python">
            <label for="python">Python</label>
            
            <input type="checkbox" id="data" name="interests" value="data">
            <label for="data">Data Science</label>
            
            <input type="checkbox" id="design" name="interests" value="design">
            <label for="design">UI/UX Design</label>
        </div>
        <br><br>
        
        <div>
            <label for="message">Tell us about yourself</label>
            <textarea id="message" name="message" placeholder="Share a bit about your learning goals..."></textarea>
        </div>
        <br><br>
        
        <div>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms"> I agree to the Terms and Conditions <span style="color: red;">*</span></label>
        </div>
        
        <div>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to our newsletter</label>
        </div>
        
        <br><br>
        <button type="submit">Sign Up</button>
        <button type="reset">Clear</button>
    </form>
    <br>
    <p>Already have an account? <a href="index.html">Back to Home</a></p>
    
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            alert("Thank you for signing up! We will be in touch soon.");
            document.getElementById("signupForm").reset();
        }
    </script>
</body>
</html>
